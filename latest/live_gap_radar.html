<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXECUTION & POSITION RADAR · 開盤跳空與收盤持倉雷達</title>
<style>
:root{
  --bg:#f3f2f2; --ink:#201e1d; --accent:#ec3013; --divider:rgba(32,30,29,.35);
  --card:#ffffff; --n100:#faf9f9; --n200:#eae7e7; --n600:#7d7979;
  --st-go-bg:#eaf8ef; --st-go-fg:#0e7039;
  --st-orb-bg:#f5edfd; --st-orb-fg:#6b21a8;
  --st-disc-bg:#fef9c3; --st-disc-fg:#854d0e;
  --st-abort-bg:#fef2f2; --st-abort-fg:#b91c1c;
  --fh:'Archivo',system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fh);font-size:14px;line-height:1.5;padding:24px 28px}
.tn{font-variant-numeric:tabular-nums}
.wrap{max-width:1650px;margin:0 auto}
.card{background:var(--card);border:2px solid var(--divider);padding:18px 22px;margin-bottom:18px}
.hud{display:flex;align-items:center;gap:20px;flex-wrap:wrap;font-size:13px}
.brand{font-size:18px;font-weight:800;letter-spacing:.04em}
.hud .m{color:var(--n600)} .hud .m b{color:var(--ink);font-weight:700}
.time{margin-left:auto;color:var(--n600);font-weight:600}
.tabs{display:flex;gap:12px;margin-top:16px;border-bottom:2px solid var(--divider);padding-bottom:10px}
.tab-btn{background:none;border:none;font-family:var(--fh);font-size:15px;font-weight:700;color:var(--n600);cursor:pointer;padding:6px 14px;border-radius:4px}
.tab-btn.active{background:var(--ink);color:#fff}
.tab-btn span{font-size:12px;opacity:0.8;font-weight:400}
.view-desc{background:#fff;border-left:3px solid var(--ink);padding:12px 16px;margin:14px 0;font-size:13px;line-height:1.6;border:1px solid var(--divider);border-left-width:3px}
.risk-box{display:flex;align-items:center;gap:8px;font-size:12px;margin-left:auto}
.risk-box input{width:80px;padding:4px 8px;border:1px solid var(--divider);border-radius:3px;font-family:var(--fh);text-align:right}
table{width:100%;border-collapse:collapse;background:var(--card);border:2px solid var(--divider);font-variant-numeric:tabular-nums;margin-top:10px}
th,td{padding:10px 14px;border-bottom:1px solid var(--divider);text-align:left;font-size:13px}
th{background:var(--n200);font-weight:700;color:var(--n600);font-size:11.5px;letter-spacing:.04em}
.r{text-align:right}
.badge{padding:3px 8px;font-size:11px;font-weight:700;border:1px solid var(--divider);border-radius:3px;white-space:nowrap}
.badge-go{background:var(--st-go-bg);color:var(--st-go-fg);border-color:var(--st-go-fg)}
.badge-orb{background:var(--st-orb-bg);color:var(--st-orb-fg);border-color:var(--st-orb-fg)}
.badge-disc{background:var(--st-disc-bg);color:var(--st-disc-fg);border-color:var(--st-disc-fg)}
.badge-abort{background:var(--st-abort-bg);color:var(--st-abort-fg);border-color:var(--st-abort-fg)}
.badge-caution{background:#f1f5f9;color:#475569;border-color:#94a3b8}
.up{color:#0e7039;font-weight:700} .dn{color:#b91c1c;font-weight:700}
.guide{color:var(--n600);font-size:12px}
</style></head>
<body><div class="wrap">
  <div class="card">
    <div class="hud">
      <span class="brand">◆ QUANTITATIVE EXECUTION & POSITION RADAR</span>
      <span class="m">待開盤新標的 <b id="cnt_open" style="color:#0e7039">0</b></span>
      <span class="m">在倉持倉跟蹤 <b id="cnt_hold" style="color:#0969da">0</b></span>
      <span class="m">全量標的池 <b id="cnt_all">0</b></span>
      <span class="time">最後刷新: <b id="up_time">—</b></span>
    </div>

    <!-- 頂部視圖切換標籤 -->
    <div class="tabs">
      <button class="tab-btn active" id="tab_open" onclick="switchView('OPEN')">⚡ 今日開盤跳空雷達 <span>(新開倉隊列)</span></button>
      <button class="tab-btn" id="tab_hold" onclick="switchView('HOLD')">📊 在倉持倉與收盤狀態 <span>(在倉風控管理)</span></button>
      <button class="tab-btn" id="tab_all" onclick="switchView('ALL')">🌐 全部標的總表 <span>(全量檢視)</span></button>
      <div class="risk-box">
        <span>單筆 1R 帳戶風險金: $</span>
        <input type="number" id="inp_risk" value="1000" step="500" onchange="updateRisk(this.value)">
      </div>
    </div>

    <div class="view-desc" id="view_desc">
      <!-- 動態說明文字 -->
    </div>
  </div>

  <table id="main_table">
    <thead id="tbl_head"></thead>
    <tbody id="tbl_body"></tbody>
  </table>
</div>

<script>
let currentView = 'OPEN';
let currentRisk = 1000.0;
let cachedData = { opening_queue: [], holding_positions: [], all_items: [] };

function switchView(v) {
  currentView = v;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (v === 'OPEN') document.getElementById('tab_open').classList.add('active');
  else if (v === 'HOLD') document.getElementById('tab_hold').classList.add('active');
  else document.getElementById('tab_all').classList.add('active');
  render();
}

function updateRisk(val) {
  currentRisk = Math.max(parseFloat(val) || 1000.0, 100.0);
  fetch('/api/set_risk?risk=' + currentRisk).catch(()=>{});
  render();
}

function render() {
  const desc = document.getElementById('view_desc');
  const thead = document.getElementById('tbl_head');
  const tbody = document.getElementById('tbl_body');

  if (currentView === 'OPEN') {
    desc.innerHTML = '<b>⚡ 【今日開盤跳空雷達 (Today\'s Opening Gap Radar)】</b>：聚焦最新交易日新鮮剛觸發之新單。' +
      '<b>實盤開盤執行守則</b>：平開標的 (AUCTION) 於 09:27:30 前送出 LOO 拍賣單；高開暴衝 (ORB) 嚴禁市價盲追，等 09:35 5m ORB 突破進場；' +
      '依擴大後的停損距離動態縮小買入股數，鎖定每筆交易損失上限為 <b>$' + currentRisk.toLocaleString() + ' (1R)</b>。';

    thead.innerHTML = `<tr>
      <th>代號</th><th>細分行業 / 策略</th><th class="r">訊號日</th><th class="r">昨收</th><th class="r">現價/盤前</th>
      <th class="r">今日跳空%</th><th class="r">Gap/ATR</th><th class="r">盤前量</th><th class="r">停損位</th>
      <th class="r">目標位</th><th class="r">動態 R:R</th><th class="r">推薦1R股數</th><th>微觀開盤決策</th><th>開盤實盤執行指引</th>
    </tr>`;

    let h = '';
    for (const r of cachedData.opening_queue) {
      const cls = r.gap_pct >= 0 ? 'up' : 'dn';
      const vol_k = r.pre_vol >= 1000 ? (r.pre_vol/1000).toFixed(1) + 'k' : r.pre_vol;
      const risk_per_share = Math.max(r.live_px - r.stop_px, 0.05);
      const shares = Math.floor(currentRisk / risk_per_share);
      h += `<tr>
        <td><b>${r.symbol}</b></td>
        <td style="color:var(--n600)">${r.industry} · <span style="color:var(--ink)">${r.screener}</span></td>
        <td class="r" style="color:var(--n600)">${r.signal_date}</td>
        <td class="r">${r.prev_close.toFixed(2)}</td>
        <td class="r"><b>${r.live_px.toFixed(2)}</b></td>
        <td class="r ${cls}">${r.gap_pct > 0 ? '+' : ''}${r.gap_pct.toFixed(2)}%</td>
        <td class="r">${r.gap_atr > 0 ? '+' : ''}${r.gap_atr.toFixed(2)}x</td>
        <td class="r" style="color:var(--n600)">${vol_k}</td>
        <td class="r">${r.stop_px.toFixed(2)}</td>
        <td class="r">${r.tgt_px.toFixed(2)}</td>
        <td class="r"><b>${r.live_rr.toFixed(1)}x</b></td>
        <td class="r" style="color:#0969da;font-weight:700">${shares.toLocaleString()} 股</td>
        <td><span class="badge ${r.open_badge}">${r.open_status}</span></td>
        <td class="guide">${r.open_guide}</td>
      </tr>`;
    }
    tbody.innerHTML = h || '<tr><td colspan="14" style="text-align:center;color:var(--n600)">今日無待開盤新標的</td></tr>';

  } else if (currentView === 'HOLD') {
    desc.innerHTML = '<b>📊 【收盤狀態與在倉持倉跟蹤 (Active Position & Close Tracker)】</b>：監控歷史已進場之在倉波段。' +
      '<b>紅隊 Bracket 出場紀律</b>：' +
      '1. <b>T+5 滯脹砍半 (T5_STAGNANT)</b>：持倉 T≥5 但獲利未達 +2%，強制平倉 50% 釋放機會成本；' +
      '2. <b>T+10 半衰期結清 (T10_EXPIRED)</b>：持倉 T≥10 天 Alpha 衰減，強制全數平倉鎖定利潤；' +
      '3. <b>跌破停損 (STOPPED_OUT)</b> 立即全平。';

    thead.innerHTML = `<tr>
      <th>代號</th><th>細分行業 / 聚落</th><th class="r">進場日</th><th class="r">持倉天數</th>
      <th class="r">進場價</th><th class="r">最新收盤/現價</th><th class="r">波段累計損益%</th>
      <th class="r">停損位</th><th class="r">目標位</th><th class="r">今日跳空%</th>
      <th>在倉出場狀態</th><th>紅隊Bracket出場執行指引</th>
    </tr>`;

    let h = '';
    for (const r of cachedData.holding_positions) {
      const cls = r.cum_pnl_pct >= 0 ? 'up' : 'dn';
      const gap_cls = r.gap_pct >= 0 ? 'up' : 'dn';
      h += `<tr>
        <td><b>${r.symbol}</b></td>
        <td style="color:var(--n600)">${r.industry}</td>
        <td class="r" style="color:var(--n600)">${r.signal_date}</td>
        <td class="r" style="font-weight:700;color:#0969da">T+${r.holding_days}</td>
        <td class="r">${r.signal_px.toFixed(2)}</td>
        <td class="r"><b>${r.live_px.toFixed(2)}</b></td>
        <td class="r ${cls}">${r.cum_pnl_pct > 0 ? '+' : ''}${r.cum_pnl_pct.toFixed(1)}%</td>
        <td class="r">${r.stop_px.toFixed(2)}</td>
        <td class="r">${r.tgt_px.toFixed(2)}</td>
        <td class="r ${gap_cls}">${r.gap_pct > 0 ? '+' : ''}${r.gap_pct.toFixed(2)}%</td>
        <td><span class="badge ${r.holding_badge}">${r.holding_status}</span></td>
        <td class="guide">${r.holding_guide}</td>
      </tr>`;
    }
    tbody.innerHTML = h;

  } else {
    desc.innerHTML = '<b>🌐 【全部標的總表 (All Candidates)】</b>：包含全部候選標的之綜合數據清單。';
    thead.innerHTML = `<tr>
      <th>代號</th><th>細分行業</th><th class="r">訊號日</th><th class="r">持倉天數</th><th class="r">昨收</th>
      <th class="r">現價</th><th class="r">今日跳空%</th><th class="r">波段損益%</th><th class="r">停損位</th>
      <th>開盤決策</th><th>持倉出場決策</th>
    </tr>`;
    let h = '';
    for (const r of cachedData.all_items) {
      const gap_cls = r.gap_pct >= 0 ? 'up' : 'dn';
      const pnl_cls = r.cum_pnl_pct >= 0 ? 'up' : 'dn';
      h += `<tr>
        <td><b>${r.symbol}</b></td>
        <td style="color:var(--n600)">${r.industry}</td>
        <td class="r">${r.signal_date}</td>
        <td class="r">T+${r.holding_days}</td>
        <td class="r">${r.prev_close.toFixed(2)}</td>
        <td class="r"><b>${r.live_px.toFixed(2)}</b></td>
        <td class="r ${gap_cls}">${r.gap_pct > 0 ? '+' : ''}${r.gap_pct.toFixed(2)}%</td>
        <td class="r ${pnl_cls}">${r.cum_pnl_pct > 0 ? '+' : ''}${r.cum_pnl_pct.toFixed(1)}%</td>
        <td class="r">${r.stop_px.toFixed(2)}</td>
        <td><span class="badge ${r.open_badge}">${r.open_status}</span></td>
        <td><span class="badge ${r.holding_badge}">${r.holding_status}</span></td>
      </tr>`;
    }
    tbody.innerHTML = h;
  }
}

async function poll() {
  try {
    const res = await fetch('/api/live');
    const d = await res.json();
    cachedData = {
      opening_queue: d.opening_queue || [],
      holding_positions: d.holding_positions || [],
      all_items: d.all_items || []
    };
    document.getElementById('up_time').innerText = d.time;
    document.getElementById('cnt_open').innerText = cachedData.opening_queue.length;
    document.getElementById('cnt_hold').innerText = cachedData.holding_positions.length;
    document.getElementById('cnt_all').innerText = cachedData.all_items.length;
    render();
  } catch(e) {}
}
